<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 74 236 232">
  <!-- BT·01 硬件拟物耳机机器人（裁剪自 BT01-耳机Bot-硬件拟物.html，去掉地面投影与留白） -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efede8"/><stop offset="1" stop-color="#c7c4bd"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dad8d3"/><stop offset=".5" stop-color="#98968f"/><stop offset="1" stop-color="#c6c4bf"/>
    </linearGradient>
    <linearGradient id="cupG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e43"/><stop offset="1" stop-color="#1c1e22"/>
    </linearGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.1" fill="#26282d"/>
    </pattern>
    <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#0d0e10"/>
    </pattern>
    <style>
      .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: bt01-blink 4.6s ease-in-out infinite; }
      .led { animation: bt01-led 2.2s ease-in-out infinite; }
      @keyframes bt01-blink { 0%, 91%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(0.1); } }
      @keyframes bt01-led { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- 头壳 -->
  <rect x="110" y="128" width="180" height="172" rx="44" fill="url(#shell)" stroke="#b3b0a9" stroke-width="1.5"/>
  <!-- 头带 + 顶部高光 -->
  <path d="M 113 182 C 113 56, 287 56, 287 182" fill="none" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 150 96 C 168 78, 232 78, 250 96" fill="none" stroke="#f4f3f0" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <!-- 面屏：点阵 + 顶部反光 -->
  <rect x="134" y="162" width="132" height="100" rx="18" fill="#17181c"/>
  <rect x="134" y="162" width="132" height="100" rx="18" fill="url(#dots)"/>
  <rect x="134" y="162" width="132" height="34" rx="18" fill="#ffffff" opacity=".05"/>
  <!-- 待机嘴 -->
  <rect x="184" y="240" width="32" height="5" rx="2.5" fill="#dfe3e9" opacity=".85"/>
  <!-- 眼睛 -->
  <rect class="eye" x="164" y="194" width="14" height="24" rx="4" fill="#f2f5f8"/>
  <rect class="eye" x="222" y="194" width="14" height="24" rx="4" fill="#f2f5f8"/>
  <!-- 录音指示灯 -->
  <circle class="led" cx="251" cy="149" r="4.5" fill="#ff9f0a"/>
  <!-- 铭牌 -->
  <text x="200" y="291" text-anchor="middle" font-size="11" letter-spacing="3" fill="#8f8c85" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">BT·01</text>
  <!-- 耳罩 -->
  <g transform="rotate(-6 103 205)">
    <rect x="87" y="174" width="32" height="62" rx="15" fill="url(#cupG)" stroke="#101114"/>
    <rect x="92" y="181" width="22" height="46" rx="10" fill="url(#mesh)"/>
    <circle class="led" cx="103" cy="238" r="2.5" fill="#ff9f0a"/>
  </g>
  <g transform="rotate(6 297 205)">
    <rect x="281" y="174" width="32" height="62" rx="15" fill="url(#cupG)" stroke="#101114"/>
    <rect x="286" y="181" width="22" height="46" rx="10" fill="url(#mesh)"/>
    <circle class="led" cx="297" cy="238" r="2.5" fill="#ff9f0a"/>
  </g>
</svg>
